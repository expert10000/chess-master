name: Source archive preflight regression
on:
  pull_request:
    paths:
      - 'scripts/verify-clean-source-build.py'
      - 'scripts/test-clean-source-preflight.py'
      - 'scripts/stockfish-source-archive.py'
      - 'scripts/test-stockfish-source-archive.py'
      - '.github/workflows/source-preflight-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile test scripts
        run: |
          python -m py_compile scripts/verify-clean-source-build.py scripts/review-clean-source-build.py scripts/test-clean-source-preflight.py scripts/stockfish-source-archive.py scripts/test-stockfish-source-archive.py
      - name: Reject forged and unsafe ZIPs
        run: python scripts/test-clean-source-preflight.py -v
      - name: Validate symlink-safe Stockfish archive extraction
        run: python scripts/test-stockfish-source-archive.py -v
